name: Android CI

on:
  push:
    branches:
      - post-core-integration
      - ci/**
  pull_request:
    branches:
      - post-core-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify LiliyaPro
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x ./gradlew ./tools/core-complete-guard.sh

      - name: Interaction tests
        run: ./gradlew :interaction:test --console=plain

      - name: Core complete guard
        run: bash ./tools/core-complete-guard.sh

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: liliyapro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
